<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · EL MAESTRO</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header}"></div><main class="auth"><p class="eyebrow">ÁREA DO CLIENTE</p><h1>Bem-vindo de volta.</h1><p th:if="${param.error}" class="error">E-mail ou senha inválidos.</p><p th:if="${success}" class="success" th:text="${success}"></p><form method="post" action="/login"><label>E-mail<input type="email" name="username" required autocomplete="email"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button class="button">ENTRAR</button></form><p>Não tem conta? <a href="/cadastro">Criar cadastro</a></p></main></body></html>
