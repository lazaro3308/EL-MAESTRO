<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="|EL MAESTRO · ${product.name}|">Perfume</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header}"></div><main class="detail"><div class="detail-bottle"><span>EL MAESTRO</span><b th:text="${product.name}">Perfume</b></div><section><p class="eyebrow" th:text="${product.family}">Família</p><h1 th:text="${product.name}">Nome</h1><p th:text="${product.description}">Descrição</p><p><b>Concentração:</b> <span th:text="${product.concentration}"></span></p><p><b>Volume:</b> <span th:text="${product.volume}"></span></p><p><b>Notas:</b> <span th:text="${product.notes}"></span></p><h2 th:text="|R$ ${#numbers.formatDecimal(product.price,1,'POINT',2,'COMMA')}|">R$ 250,00</h2><p th:text="|Disponíveis: ${product.stock}|"></p><form action="/carrinho/adicionar" method="post"><input type="hidden" name="slug" th:value="${product.slug}"><label>Quantidade <input type="number" name="quantity" value="1" min="1" max="30"></label><button class="button">ADICIONAR À SACOLA</button></form></section></main></body></html>
