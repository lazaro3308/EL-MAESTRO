<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro · EL MAESTRO</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header}"></div><main class="auth"><p class="eyebrow">EL MAESTRO</p><h1>Crie sua conta.</h1><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/cadastro"><label>Nome completo<input name="name" required maxlength="120"></label><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" required minlength="12" autocomplete="new-password"><small>Mínimo de 12 caracteres.</small></label><button class="button">CRIAR CONTA</button></form><p>Já possui conta? <a href="/entrar">Entrar</a></p></main></body></html>
