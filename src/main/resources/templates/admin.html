<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · EL MAESTRO</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments/header}"></div><main class="admin"><p class="eyebrow">GESTÃO DA MARCA</p><h1>Painel administrativo</h1><form class="admin-form" action="/admin/produto" method="post"><h2>Novo perfume / editar por ID</h2><input name="id" type="number" placeholder="ID (vazio para novo)"><input name="name" placeholder="Nome" required><input name="slug" placeholder="slug-unico" required><input name="family" placeholder="Família olfativa"><input name="concentration" placeholder="Concentração"><input name="price" type="number" min="0" step=".01" value="250" required><input name="stock" type="number" min="0" value="30" required><input name="description" placeholder="Descrição"><input name="notes" placeholder="Notas"><button class="button">SALVAR PERFUME</button></form><h2>Catálogo e estoque</h2><table><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Ação</th></tr><tr th:each="p : ${products}"><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.stock}"></td><td><form th:action="@{/admin/produto/{id}/excluir(id=${p.id})}" method="post"><button>Excluir</button></form></td></tr></table></main></body></html>
